      - generic [ref=e29]:
        - paragraph [ref=e30]: Електрическото табло е сърцето на всяка инсталация — то разпределя тока към всеки контур в имота и защитава хората и уредите при претоварване или късо съединение. Старите табла с бобини и топящи се предпазители вече не отговарят на съвременните изисквания за безопасност и не могат да защитят чувствителната техника в днешния дом.
        - paragraph [ref=e31]: При смяна на табло в София извършваме пълна подмяна на старото разпределително табло с ново, оборудвано с автоматични предпазители, диференциална защита (RCD) и главен прекъсвач. Диференциалната защита е задължителна по БДС EN 60364 и спасява живот при токов удар — тя изключва тока в рамките на 30 милисекунди.
        - paragraph [ref=e32]: Преди монтажа правим оглед на цялата инсталация — проверяваме заземяването, измерваме съпротивлението на изолацията и определяме правилния размер на таблото спрямо броя контури. Работим с табла на водещи марки — Legrand, Schneider Electric, ABB. След монтажа издаваме протокол за изпълнена работа и даваме гаранция.
        - paragraph [ref=e33]: Смяната на табло в апартамент в София обикновено отнема 3–5 часа. За по-голяма къща или офис с повече контури — половин работен ден. Работим чисто, покриваме пода и почистваме след себе си.
